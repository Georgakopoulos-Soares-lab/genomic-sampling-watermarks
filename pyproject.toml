[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "genomic-sampling-watermarks"
version = "0.1.0"
description = "Position-independent SynthID watermark experiments for genomic DNA generation"
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = []

[project.optional-dependencies]
models = [
  "huggingface-hub>=0.34",
  "safetensors>=0.8",
  "torch>=2.9",
  "transformers>=4.57.6",
]
analysis = [
  "matplotlib>=3.9",
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=18",
  "scikit-learn>=1.6",
  "scipy>=1.14",
]
dev = [
  "pytest>=8.3",
  "pyyaml>=6.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/genomic_watermarks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
