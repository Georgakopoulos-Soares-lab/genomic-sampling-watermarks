schema_version: 1
cohort_id: ncbi_refseq_eukaryote_windows_fpr_v2_1608
purpose: Output-blind independent SynthID false-positive-rate cohort with 1544 evaluation prompts
created: "2026-09-21"

source:
  provider: NCBI
  database: nuccore_refseq
  endpoint: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi
  metadata_endpoint: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi
  access_documentation: https://www.ncbi.nlm.nih.gov/books/NBK25499/
  usage_policy: https://www.ncbi.nlm.nih.gov/home/about/policies/
  reuse_status: NCBI places no restrictions on molecular data; original submitter rights may apply

selection:
  record_count: 12
  windows_per_record: 134
  prompt_count: 1608
  prompt_length_bases: 384
  public_null_length_bases: 3072
  source_span_length_bases: 3072
  coordinate_system: one_based_inclusive
  strand: forward
  selection_label: genomic-sampling-watermarks/refseq-fpr-v2-1608/stratified-sha256
  rule: >-
    Divide each accession-versioned chromosome into 134 non-overlapping equal-length coordinate
    segments. Within segment s, hash selection_label, accession, s, and attempt; map the first
    64 digest bits uniformly by integer remainder onto starts whose complete 3072-base source
    span fits in that segment. Accept the first span containing canonical A/C/G/T only. The first
    384 bases are the generation prompt and the complete span is the public-DNA detector null.
  maximum_canonical_retries: 64
  selection_used_model_output: false
  filters:
    - exact accession.version required
    - complete source span lies inside its preregistered segment
    - exactly 3072 canonical A/C/G/T bases in the source span
    - prompt is exactly the first 384 source-span bases
    - prompt and public-null lengths are divisible by six
    - no duplicate prompt or public-null sequence
    - no overlapping source spans within an accession
  exclusions:
    - human or patient sequences
    - controlled-access data
    - ambiguous-base spans
    - organelle and plasmid records

