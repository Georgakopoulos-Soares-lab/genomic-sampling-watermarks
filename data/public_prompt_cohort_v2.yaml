schema_version: 1
cohort_id: ncbi_refseq_eukaryote_windows_v2
purpose: Output-blind expansion after the frozen G_tok E2 prompt-stability trigger fired
created: "2026-08-21"

source:
  provider: NCBI
  database: nuccore_refseq
  endpoint: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi
  retrieval_type: fasta
  access_documentation: https://www.ncbi.nlm.nih.gov/books/NBK25499/
  usage_policy: https://www.ncbi.nlm.nih.gov/home/about/policies/
  reuse_status: NCBI places no restrictions on molecular data; original submitter rights may apply

selection:
  organism_scope: The same four public model organisms, with two reference chromosomes each
  expansion_rule: Retain v1 and add one different chromosome per organism before model inspection
  window_length_bases: 384
  window_positions: [0.2, 0.5, 0.8]
  coordinate_system: one_based_inclusive
  coordinate_rule: floor(position * (record_length - window_length)) + 1
  strand: forward
  filters:
    - exact accession.version required
    - exactly 384 bases
    - canonical A/T/C/G only
    - length divisible by six
  exclusions:
    - human or patient sequences
    - controlled-access data
    - ambiguous bases
    - organelle and plasmid records

