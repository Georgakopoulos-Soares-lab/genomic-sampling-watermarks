  selection_label: genomic-sampling-watermarks/refseq-large-v1/stratified-sha256
  rule: Divide each accession-versioned chromosome into 16 non-overlapping equal-length coordinate segments.
    Within segment s, hash selection_label, accession, s, and attempt; map the first 64 digest bits uniformly
    by integer remainder onto starts whose complete 3072-base source span fits in that segment. Accept
    the first span containing canonical A/C/G/T only. The first 384 bases are the generation prompt and
    the complete span is the public-DNA detector null.
  maximum_canonical_retries: 64
  selection_used_model_output: false
  filters:
  - exact accession.version required
  - complete source span lies inside its preregistered segment
  - exactly 3072 canonical A/C/G/T bases in the source span
  - prompt is exactly the first 384 source-span bases
  - prompt and public-null lengths are divisible by six
  - no duplicate prompt or public-null sequence
  - no overlapping source spans within an accession
  exclusions:
  - human or patient sequences
  - controlled-access data
  - ambiguous-base spans
  - organelle and plasmid records
