      This is the unwindowed detector, which reads one full window and therefore has one alignment
      per hypothesis. It is a synchronization-limited result and must be reported as one: the
      tolerable indel rate is one to two orders of magnitude below the tolerable substitution rate
      measured in E5 on the same corpus and the same search. A windowed detector is the obvious
      repair and is E7 stage 2, which is not implemented; nothing about it may be inferred from these
      values. Indel robustness is not evidence about indels combined with substitutions or crops, nor
      about an adversary who places a single indel deliberately. Cross-policy differences are not
      admitted; each policy has its own generated corpus.
