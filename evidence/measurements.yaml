schema_version: 1

# Version-one Carbon and GENERator measurements admitted to the current manuscript by the
# 2026-09-09 amendment; additional derived GENERator panels are admitted by the 2026-09-11
# analysis amendment. New experiments require a fresh synthid.v2.* identity and the M5 path.
# Public fixture keys provide reproducibility, not evidence of resistance to key recovery.

measurements:
  - id: synthid.carbon.sampler.nominal_rejections
    status: V
    value: 13
    unit: states
    quantity: >-
      fixed Carbon states rejecting the exact fixed-key SynthID tournament distribution at nominal
      alpha 0.05
    uncertainty:
      tested_states: 256
      samples_per_state: 5000
      monte_carlo_replicates: 999
      expected_rejections_under_null: 12.8
      ordinary_control_rejections: 12
      deliberately_incorrect_control_rejections: 8
      deliberately_incorrect_control_states: 8
    scope:
      model: HuggingFaceBio/Carbon-500M
      revision: 9796b752108258c1d365089f842e62e6c0547704
      policy: canonical 4096-way DNA 6-mer categorical distribution
      watermark: synthid-tournament-v1
      depth: 30
      context_tokens: 4
      context_history_size: 1024
      cohort: ncbi_refseq_eukaryote_windows_large_v1
      fixture_keys: public reproducibility material
    source:
      artifact: outputs/carbon_synthid_e16_v1/distribution_summary.json
      sha256: 3e0016c25d7c45d32c8d3aef0066b73e3366772eae485f3e7de6518f6de77237
      protocol: docs/research/carbon_synthid_validation_v1_protocol.md
      execution: docs/research/carbon_synthid_e16_execution_2026_08_29.md
      command: >-
        /scratch/10899/kimopro/gsw-analysis-venv/bin/python
        scripts/run_carbon_large_distribution.py --output-root
        /scratch/10899/kimopro/carbon_synthid_validation_hpc_v4 --cohort-jsonl
        data/processed/ncbi_refseq_eukaryote_windows_large_v1/prompts.jsonl
        --draw-zero-sequences
        /scratch/10899/kimopro/carbon_synthid_validation_hpc_v4/generation/draw_00_sequences.jsonl
        --state-token-index 64 --draws 5000 --replicates 999 --gof-seed 2718
        --negative-control-states 8 --experiment-label
        carbon-synthid-validation-v1/distribution --tournament-depth 30 --context-tokens 4
        --context-history-size 1024 --key-average-replicates 64 --device cpu --dtype bfloat16
        --cache-dir .cache/huggingface --local-files-only --bootstrap-replicates 20000
        --permutation-replicates 100000 --analysis-seed 2718 --finalize
        --expected-state-count 256
