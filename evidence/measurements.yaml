  - id: synthid.carbon.quality.corrected_rejections
    status: V
    value: 0
    unit: metrics
    quantity: declared model-likelihood and sequence summaries significant after correction
    uncertainty:
      tested_metrics: 14
      correction: Benjamini-Hochberg
      smallest_adjusted_p_value: 0.8528214717852821
      prompt_clusters: 256
      matched_pairs: 512
    scope: *quality_scope
    source: *quality_source
    notes: >-
      These summaries cover composition, short-word diversity, repetition, Carbon likelihood, and
      perplexity. They are proxies only and do not measure biological function, viability, or safety.

