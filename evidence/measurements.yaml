  - id: synthid.v2.detector.effective_independent_windows
    status: A
    value: 831.6
    unit: effective independent tests/read
    quantity: >-
      effective number of independent window tests implied by the observed per-read minimum
      local p-value on unmarked clean reads, against the 16136 hypotheses actually searched
    derivation: >-
      maximum-likelihood fit of P(p_min > x) = (1 - x)^M_eff, giving
      M_eff = -n / sum(log(1 - p_min)) over the null reads of each cell
    uncertainty:
      by_model_and_condition:
        - {model: carbon, condition: clean, hypotheses_searched: 16136, effective_windows: 831.6, inflation: 19.4}
        - {model: carbon, condition: deletion_1nt, hypotheses_searched: 16128, effective_windows: 827.7, inflation: 19.48}
        - {model: carbon, condition: insertion_1nt, hypotheses_searched: 16144, effective_windows: 837.0, inflation: 19.29}
        - {model: carbon, condition: substitution_1nt, hypotheses_searched: 16136, effective_windows: 832.3, inflation: 19.39}
        - {model: generator, condition: clean, hypotheses_searched: 16136, effective_windows: 852.4, inflation: 18.93}
        - {model: generator, condition: deletion_1nt, hypotheses_searched: 16128, effective_windows: 843.5, inflation: 19.12}
        - {model: generator, condition: insertion_1nt, hypotheses_searched: 16144, effective_windows: 837.1, inflation: 19.29}
        - {model: generator, condition: substitution_1nt, hypotheses_searched: 16136, effective_windows: 848.0, inflation: 19.03}
      inflation_range: [18.9, 19.5]
      beta_model_observed_over_predicted_carbon_clean: {"median": 0.741, "p05": 0.544, "p95": 1.233}
    scope: *v2_fwer_scope
    source: *v2_fwer_source
    notes: >-
      M_eff matches the mean of log(1 - p_min) and is an effective summary, not a distributional
      fit: the Beta(1, M_eff) model reproduces the observed quantiles only to within a factor of
      0.54 to 1.23, because local p-values are discrete binomial tails and neighbouring windows
      share phase and nearly all tokens. Read it as an order-of-magnitude statement that the
      correction is roughly nineteen times more severe than the effective test count, not as a
      calibrated test count. The decision rule is unchanged.

