  - id: synthid.detector.strength_separation
    status: A
    value: 124.777477269006
    unit: -log10 window probability
    quantity: >-
      weakest correct-key best-window evidence on a clean read, on the same scale as the
      6.207796 decision threshold implied by 16136 windows and a 1 percent target
    derivation: >-
      minus log base ten of the retained natural-log minimum local window probability for every
      trial in the admitted trial file, summarized per family and read condition
    uncertainty:
      threshold_strength: 6.207795885205
      sequence_trials_per_cell: 384
      correct_key_by_condition:
        - read_condition: clean
          minimum: 124.777477269006
          median: 790.615101472062
          maximum: 880.688635268605
        - read_condition: one nucleotide substitution
          minimum: 124.101089689484
          median: 774.651687824803
          maximum: 866.319072554848
        - read_condition: one nucleotide insertion
          minimum: 82.161185049515
          median: 431.528318118986
          maximum: 832.388410523052
        - read_condition: one nucleotide deletion
          minimum: 114.667745947347
          median: 443.698161090995
          maximum: 849.727276109599
      clean_ordinary_maximum: 6.601607074486
      clean_wrong_key_maximum: 5.6945533924
    scope:
      <<: *position_scope
      read_condition: clean and each single-nucleotide edit
    source: *position_source
    notes: >-
      The weakest correct-key read is far above the threshold and the strongest control read is just
      above it, which is why one control prompt passes. Separation on this corpus is not a guarantee
      for other corpora, read lengths, or edit rates.

  - id: synthid.detector.strongest_window_length
    status: A
    value: 181
    unit: reads
    quantity: >-
      correct-key reads out of 384 whose strongest window was shorter than the full 3072-base window
      after one nucleotide insertion
    derivation: >-
      window length of the best-scoring hypothesis for every correct-key trial in the admitted trial
      file, tallied by read condition
    uncertainty:
      sequence_trials_per_cell: 384
      counts_by_condition:
        - read_condition: clean
          window_base_length_counts: {384: 0, 768: 0, 1536: 1, 3072: 383}
        - read_condition: one nucleotide substitution
          window_base_length_counts: {384: 0, 768: 0, 1536: 1, 3072: 383}
        - read_condition: one nucleotide insertion
          window_base_length_counts: {384: 0, 768: 1, 1536: 180, 3072: 203}
        - read_condition: one nucleotide deletion
          window_base_length_counts: {384: 0, 768: 1, 1536: 151, 3072: 232}
    scope:
      <<: *position_scope
      read_condition: clean and each single-nucleotide edit
      family: correct-key SynthID
    source: *position_source
    notes: >-
      An insertion or deletion shifts the 6-mer grouping, so a later start with a shorter window
      often carries the strongest evidence. Detection stayed positive in every one of these reads.

