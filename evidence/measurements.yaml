# Corrections. Superseded measurement IDs are recorded here so an audit can see what changed and
# why. The superseded artifacts remain on disk unmodified but are no longer cited by any entry.
superseded_measurements:
  - measurement_id_prefix: e4.clean_detection
    superseded_ids: 12
    replaced_by_suffix: .v2
    reason: >-
      The calibrated threshold was chosen by counting null exceedances strictly above a candidate,
      but the decision rule applied was greater-than-or-equal. Because the statistic is discrete and
      the threshold is itself a null order statistic, ties at the threshold were counted as
      detections, so the realized false-positive rate exceeded the reported one, for example 0.0125
      against a reported 0.009375 and a target of 0.01. The rule is now strictly greater than the
      threshold everywhere, including the bootstrap indicators.
    effect_on_values: >-
      No E4 detection rate, threshold, or achieved false-positive rate changed; the reported
      achieved rate had already used the strict count and now matches the rule that is applied.
  - measurement_id_prefix: e5.substitution
    superseded_ids: 12
    replaced_by_suffix: .v2
    reason: same strict-decision-rule correction as e4.clean_detection
    effect_on_values: >-
      Every headline value, that is the largest fully detected substitution rate, is unchanged. Of
      28 curve cells per policy, one to three moved, all downward, and all inside the collapsed tail
      where detection was already far below 1.0.
  - measurement_id_prefix: e10.unkeyed_distinguisher
    superseded_ids: 1
    replaced_by_suffix: .minimum_permutation_p_value
    reason: >-
      The p-value came from an exact sign-flip over prompt clusters, which assumes prompts are
      independently relabellable. They are not: every decision uses a direction fitted from the other
      prompts' labels, so the decisions share a fitted quantity and the sign-flip null is too narrow.
      Replicating the whole procedure on true-null synthetic data showed accuracies from 0.16 to 0.75,
      a far wider spread than the sign-flip null admits, so its p-values were anti-conservative. The
      admitted test now permutes labels within each pair and re-runs the fitting.
    effect_on_values: >-
      The C_tok conclusion is unchanged, and no distinguisher separates the arms for C_tok or G_tok.
      Under the corrected null two G_bp distinguishers are nominally significant in the below-chance
      direction, neither clearing the Bonferroni threshold across the nine tests; that is recorded as
      unresolved.
  - measurement_id_prefix: e5.substitution, e6.crop_strand, e7.deletion, e7.insertion, e7.stage2
    superseded_ids: interval fields only, 624 values across 312 curve points
    replaced_by_suffix: same ids, interval fields recomputed
    reason: >-
      Detection-rate intervals resampled only the positive prompt clusters, which treats the
      calibrated threshold as known when it is estimated from the null trials. On cells where the
      positive and null statistics are close this understates the interval by up to about 3.6 times,
      and on a unanimous cell it reported a degenerate interval that claimed more certainty than the
      data supports. Intervals are now a joint resample of the nulls, which recalibrates the
      threshold, and the prompt clusters.
    effect_on_values: >-
      No point estimate changed: not one detection rate, threshold, achieved false-positive rate,
      largest fully detected rate, or separation flag. Only interval bounds moved, on 29 of 84 E5
      cells and similarly elsewhere. Eight previously degenerate unanimous intervals now carry honest
      bounds, for example C_tok substitution at rate 0.15 and 1,536 bases moving from [1.000, 1.000]
      to [0.875, 1.000]. The E4 clean-detection and short-length intervals were checked the same way
      and are unchanged, because their margins are large.
