# E10 held-out unkeyed distinguishers, revision 2. An observer without the key attempts a paired
# forced choice between a watermarked and an ordinary sequence from the same generation draw. The
# admitted test is a two-sided permute-and-refit null: labels are permuted within each pair and the
# whole procedure including the fitting is re-run. Revision 1 used an exact prompt sign-flip, which
# is anti-conservative here because every decision shares a fitted direction.

