# E3 stage-1 distribution-preservation family summaries. Each value is the smallest Monte Carlo
# goodness-of-fit p-value over the four tested model states for one policy and one arm, with the
# admitted rejection counts at the nominal and Bonferroni levels. These are correctness results for
# the `partition_mc` implementation, not detection results.

  - id: e3.preservation.c_tok.watermarked_minimum_p_value
    status: V
    value: 0.238
    unit: p-value
    quantity: >-
      smallest Monte Carlo goodness-of-fit p-value across the four tested model states for the
      watermarked arm
    admitted_counts:
      tests: 4
      alpha: 0.05
      bonferroni_alpha: 0.0125
      rejections_at_alpha: 0
      rejections_at_bonferroni: 0
      expected_rejections_at_alpha_under_null: 0.2
    scope:
      model_policy: C_tok
      model_id: HuggingFaceBio/Carbon-500M
      revision: 9796b752108258c1d365089f842e62e6c0547704
      policy_definition: >-
        Carbon-500M main revision restricted and renormalized over the 4,096 canonical 6-mers.
      arm: partition-mc-v1
      arm_role: >-
        Keyed maximal-coupling watermarked draws at the frozen state.
      device: mps
      dtype: bfloat16
      cohort_id: ncbi_refseq_eukaryote_windows_v2
      cohort_content_sha256: 1bb980d4be5dad5769e9ccc18a78133d7638e0bf78ebd2df2dcfdcf0d2a254ed
      cohort_manifest_sha256: 539b5b9a304ac0d901e70712a2f97cd7667ccff0b2f3f15f9b6efa9c28b4ca8e
      tested_states:
        - yeast_q50
        - arabidopsis_q50
        - celegans_q50
        - drosophila_q50
      prompt_length_bases: 384
      draws_per_state_and_arm: 8000
      test: parametric Monte Carlo categorical goodness-of-fit on the G statistic
      monte_carlo_replicates: 999
      monte_carlo_seed: 2718
      monte_carlo_p_value_floor: 0.001
      key_material: published non-secret fixture
      temperature: 1.0
      truncation: none
    source:
      analysis_artifact: outputs/carbon_c_tok_e3_preservation_analysis_v1.json
      analysis_sha256: 2de589db9f31753973d52b8b52f115e97224b87416591ee259996768ce02de13
      report_artifact: outputs/carbon_c_tok_e3_preservation_v1.json
