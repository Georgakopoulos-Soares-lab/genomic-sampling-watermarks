      command: >-
        PYTORCH_ENABLE_MPS_FALLBACK=1 uv run python scripts/audit_distribution_preservation.py
        --policy C_tok --cohort-jsonl data/processed/ncbi_refseq_eukaryote_windows_v2/prompts.jsonl
        --case-id yeast_q50 --case-id arabidopsis_q50 --case-id celegans_q50 --case-id
        drosophila_q50 --draws 8000 --replicates 999 --gof-seed 2718 --experiment-label
        e3-preservation-v1 --cache-dir .cache/huggingface --local-files-only --output
        outputs/carbon_c_tok_e3_preservation_v1.json
      analysis_command: >-
        uv run python scripts/analyze_preservation.py --input
        outputs/carbon_c_tok_e3_preservation_v1.json --cohort-jsonl
        data/processed/ncbi_refseq_eukaryote_windows_v2/prompts.jsonl --cohort-manifest
        data/public_prompt_cohort_v2.yaml --output
        outputs/carbon_c_tok_e3_preservation_analysis_v1.json
    notes: >-
      Fixed-state one-step marginal test. Draws are independent given the state; the four states are
      not independent genomic observations. A pass supports marginal preservation at the tested
      states and is not evidence of sequence-level indistinguishability. Per-state p-values remain
      unadmitted engineering detail: the paper reports this family summary, not the state table.
